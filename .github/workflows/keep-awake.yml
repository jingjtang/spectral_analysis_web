name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"     
  workflow_dispatch: {}         

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl health endpoint
        run: |
          set -e
          URL="https://spectral-analysis-web.onrender.com/healthz"
          curl -sSfL "${URL}?ts=$(date +%s)" -m 20 -o /dev/null
